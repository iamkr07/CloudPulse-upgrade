services:
  - type: web
    name: cloudpulse-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python ml/data/download.py
      python ml/data/prepare.py
      python ml/precompute_explanations.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        sync: false
